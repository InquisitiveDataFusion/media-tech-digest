name: Harvest feeds

# Runs every three hours and adds anything new to data/harvest.json.
#
# This exists because RSS feeds are shallow. A diagnostic run found 17 of 28
# feeds could not reach back far enough to cover a single digest window, and
# Variety's feed held under a day of news. Anything older was lost before the
# digest ever ran. Harvesting often means the digest reads from a store that
# remembers what the feeds have forgotten.
#
# No Gemini call, so this costs nothing but a little runner time.

on:
  schedule:
    - cron: "41 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: harvest
  cancel-in-progress: false

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Harvest the feeds
        run: python harvest.py

      - name: Save what was found
        run: |
          if [ -z "$(git status --porcelain data/harvest.json)" ]; then
            echo "No new stories since the last harvest."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/harvest.json
          git commit -m "Harvest $(date -u +'%Y-%m-%d %H:%M')"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
