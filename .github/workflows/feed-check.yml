name: Check feeds

# Run this by hand from the Actions tab whenever the digest looks thin.
# It tests every RSS feed and prints which ones are dead or stale.
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python feed_check.py
