name: Diagnose the digest

# Run this by hand when a digest comes out thinner than expected.
# It reports what the feeds are actually offering, what got filtered out,
# and whether the feeds can even cover the window.
#
# It does not call Gemini and writes nothing, so it is free and safe.

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Optional: look at the last N days instead of the normal window"
        required: false
        default: ""

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python diagnose.py ${{ inputs.days }}
