name: Rebuild all editions

# Run this by hand after changing anything that affects how the pages look:
# colours or layout in template.py, or the title in uk_media_digest.py.
#
# It re-renders every past edition from its saved data, so the whole archive
# picks up the change instead of only future editions.
#
# It does not call Gemini and does not fetch news, so it costs nothing and
# is safe to run as often as you like. No wording is ever changed.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: digest
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Rebuild every edition
        run: python rebuild.py

      - name: Publish the rebuilt pages
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Every page already matched the current design. Nothing to publish."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Rebuild all editions with the current design"
          # Show anything unexpected in the tree, so a stray modified file
          # is visible in the log rather than breaking the push silently.
          echo "Working tree state:"
          git status --porcelain
          git push || {
            echo "Push rejected, another run got there first. Syncing and retrying."
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            git push
          }
