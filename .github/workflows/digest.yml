name: Build digest

on:
  schedule:
    # GitHub cron is always UTC and has no timezone setting, so the job
    # fires TWICE, an hour apart, on Mondays and Thursdays. One of those is
    # 02:00 in London; the other is not. This keeps 2am UK correct through
    # both GMT and British Summer Time with no manual edits ever.
    #
    # The script decides which one does the work by checking whether an
    # edition already exists for today, not by looking at the clock. That
    # matters because GitHub's scheduler is best effort and can run jobs
    # well over an hour late.
    #
    # The odd minute is deliberate. Scheduled jobs on the hour compete with
    # everyone else's and get delayed most often.
    - cron: "17 1 * * 1,4"
    - cron: "17 2 * * 1,4"
  workflow_dispatch:
    inputs:
      force:
        description: "Build now, even if today already has an edition"
        type: boolean
        default: true
      generous:
        description: "Showcase mode: ask for a longer digest, more sections"
        type: boolean
        default: false
      window_days:
        description: "Cover the last N days instead of since the last run (blank = normal)"
        required: false
        default: ""
      min_score:
        description: "Relevance bar, lower lets more through (blank = 4)"
        required: false
        default: ""
      max_per_region:
        description: "Articles per region sent to Gemini (blank = 45)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: digest
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Check the script is there
        run: |
          if [ -f "uk_media_digest.py" ]; then
            echo "Found uk_media_digest.py. Good to go."
          else
            echo "uk_media_digest.py NOT FOUND."
            echo ""
            echo "Files in this repository:"
            ls -la
            echo ""
            echo "Fix: upload uk_media_digest.py to the top level of the repo."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install libraries
        run: pip install -r requirements.txt

      - name: Build the digest
        id: build
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FORCE_RUN: ${{ inputs.force && 'true' || '' }}
          GENEROUS: ${{ inputs.generous && 'true' || '' }}
          WINDOW_DAYS: ${{ inputs.window_days }}
          MIN_SCORE: ${{ inputs.min_score }}
          MAX_PER_REGION: ${{ inputs.max_per_region }}
        run: python uk_media_digest.py

      - name: Publish the new edition
        if: steps.build.outputs.published == 'true'
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Nothing changed, so nothing to publish."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Digest for $(date -u +%Y-%m-%d)"
          # Both triggers can overlap if GitHub delays one of them. Rebasing
          # first means the second push tops up rather than being rejected.
          # Show anything unexpected in the tree, so a stray modified file
          # is visible in the log rather than breaking the push silently.
          echo "Working tree state:"
          git status --porcelain
          git push || {
            echo "Push rejected, another run got there first. Syncing and retrying."
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            git push
          }
